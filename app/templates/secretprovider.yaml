# THis is an example placeholder for secretProviderClass for AWS Secrets Manager. This is used to inject secrets into the pod at runtime. The secrets are pulled from AWS Secrets Manager and stored in the pod's filesystem at /mnt/secrets. The application can then read the secrets from the filesystem. This is a placeholder and should be replaced with your own secret provider class.
# not hooked up to the app yet, but this is an example of how to use it. The app will need to be modified to read the secrets from the filesystem at /mnt/secrets. The secrets will be injected into the pod at runtime by the external-secrets operator. The external-secrets operator will watch for changes to the secret in AWS Secrets Manager and update the secret in the pod's filesystem at /mnt/secrets. The app can then read the secrets from the filesystem at /mnt/secrets.
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: myapp-secrets
spec:
  provider: aws
  parameters:
    region: us-east-1
    objects: |
      - objectName: "prod/myapp"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "username"
          - path: "password"
            objectAlias: "secretvalue"
          - path: "connection_string"
            objectAlias: "connection_string"
