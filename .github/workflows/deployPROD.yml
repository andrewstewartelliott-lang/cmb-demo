name: Staging

on:
  workflow_dispatch:
    inputs:
      app_version:
        description: Deploy app to PROD environment
        required: true
        type: string
        default: "1.0.0"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Deploy to staging
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          if [[ ! "$APP_VERSION" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "Invalid Docker image tag: $APP_VERSION" >&2
            exit 1
          fi

          helm upgrade --install app ./app \
            --set-string "image.tag=$APP_VERSION" \
            --namespace app \
            --create-namespace